name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install aiohttp
      - run: python tools/check_project.py
      - run: python -m unittest discover -s tests -p "test_release*.py" -v
      - run: python -m unittest discover -s tests -p "test_imagebatch_routes.py" -v
